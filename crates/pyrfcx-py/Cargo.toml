[package]
name = "pyrfcx-py"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SAP NW RFC client — PyO3 abi3 binding"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyrfcx-core = { path = "../pyrfcx-core" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
indexmap = "2"
